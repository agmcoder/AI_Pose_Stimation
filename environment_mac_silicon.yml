name: pose_tracker_mac_silicon
channels:
  - pytorch          # PyTorch oficial — resuelve osx-arm64 correctamente
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  - pip
  # PyTorch con soporte MPS (Metal Performance Shaders) — Apple Silicon
  # No existe pytorch-cuda en arm64; la GPU se activa vía MPS automáticamente
  - pytorch::pytorch
  - pytorch::torchvision
  - pytorch::torchaudio
  - conda-forge::opencv>=4.9
  - conda-forge::pyyaml
  - conda-forge::loguru
  - conda-forge::rich
  - conda-forge::numpy<2
  - pip:
      - ultralytics>=8.2
      - lap
      - filterpy
      - PySide6>=6.10
      - pytest>=9.0
