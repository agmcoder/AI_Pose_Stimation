app:
  source: /home/alejandro/Downloads/IMG_6261_squats.MOV #0
  display_window: true
  target_fps: 30
  max_persons: 20

  window:
    name: "AI Fitness Tracker"
    initial_width: 1280
    initial_height: 720
    min_width: 860
    min_height: 400

  dashboard:
    panel_width: 320          # ancho del panel lateral en px
    panel_title: "CLASS STATS"
    ids_per_line_limit: 34    # caracteres antes de hacer salto de línea en el desglose

  data_collection:
    enabled: true
    output_dir: "data/sessions"
    deferred_labeling:
      confirm_window: 12       # frames of consecutive exercise signal to confirm
      cooldown_window: 8       # frames of no-exercise before closing event
      max_buffer_size: 300     # safety cap for per-track buffer
      enter_threshold: 0.5    # LSTM confidence to enter exercise (hysteresis high)
      exit_threshold: 0.3     # LSTM confidence to exit exercise (hysteresis low)
      min_segment_frames: 8   # minimum frames for a valid segment (reject noise)
      merge_gap_frames: 5     # merge adjacent segments with gaps smaller than this
    backends:
      - type: csv
        filename_prefix: "frames"
      - type: jsonl
        filename_prefix: "session"

pipeline:
  use_threading: true
  num_workers: 4
  frame_queue_size: 8
