exercises:
  squat:
    enabled: true
    min_confidence: 0.5

    knee:
      # Rango válido de rodilla en posición DOWN
      down_min: 80        # < 80° = demasiado profundo
      down_max: 120       # > 120° = no baja suficiente
      up_threshold: 155   # ángulo mínimo para considerar posición UP

    hip:
      # Rango válido de cadera en posición DOWN
      down_min: 50        # < 50° = cadera demasiado cerrada
      down_max: 100       # > 100° = cadera no baja suficiente
      up_threshold: 150   # ángulo mínimo para considerar posición UP

    feedback:
      valid_rep:    "✅ Rep completada"
      knee_low:     "⚠️ Rodilla demasiado cerrada"
      knee_high:    "⚠️ Baja más la rodilla"
      hip_low:      "⚠️ Cadera demasiado cerrada"
      hip_high:     "⚠️ Baja más la cadera"
      bad_form_rep: "⚡ Rep no contada (mejorar técnica)"
